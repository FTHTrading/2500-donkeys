# ──────────────────────────────────────────────────────────────
# LPS Provenance Verifier — Continuous Verification
# 
# Runs the full provenance verification on every push to master
# and on pull requests. No secrets required — the verifier uses
# only public Polygon RPC endpoints.
#
# Pipeline: build (compile+hash+manifest) → hardhat test → verify
# ──────────────────────────────────────────────────────────────

name: LPS Verify

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    name: Build + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

  verify:
    name: Provenance Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (compile + hash + manifest)
        run: npm run build

      - name: Run provenance verifier
        run: npm run lps:verify

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: dist/verification-report.json
          retention-days: 90
